<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gang Kaibigan lang Club Members</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h3>Gang Kaibigan Lang Club Members Form</h3>
 
        <input type="text" id="fname" class="form-control mb-2" placeholder="First name">
        <input type="text" id="lname" class="form-control mb-2" placeholder="Last name">
        <button py-click="add_member" class="btn btn-success mb-3">Add Member</button>
 
        <div id="results" class="p-3 rounded bg-dark text-warning"></div>
    </div>
 
    <script type="py">
from pyscript import document
 
grade7 = {"Simon Malimban", "Peter Navarro", "Khail Resurreccion"}
grade8 = {"David Barretto", "Qody Omengan", "Lucas Achilles"}
grade9 = {"Adam Villarica", "Andrew Barretto", "Joaquin Pascua"}
grade10 = {"Dylan Cascalla", "Bhavik Aku", "Luke Blas", "Gurvinder Virk", "Xander Espinosa"}
added = set()
 

def add_member(event):
    global added
    first = document.querySelector("#fname").value
    last = document.querySelector("#lname").value
 
    added = added | {first + " " + last}
    members = grade7 | grade8 | grade9 | grade10 | added

    names = "<br>".join(sorted(members))
    document.querySelector("#results").innerHTML = f"All members:<br>{names}<br>Total members: {len(members)}"
    </script>
</body>
</html>
